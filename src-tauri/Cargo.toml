[package]
name = "TARAB"
version = "1.0.0"
description = "A fast local music player with enhanced lyrics"
edition = "2021"
license = "MIT"

[lib]
name = "tarab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Startup failure dialog shown before the Tauri event loop runs (already used by the dialog plugin).
rfd = { version = "0.16", default-features = false }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-media = "0.1.1"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio playback
cpal = "0.15.3"
rodio = { version = "0.19", features = ["symphonia-all"] }
wsola = "0.2"
symphonia = { version = "0.5", features = ["aac", "aiff", "alac", "flac", "mp3", "vorbis", "wav", "isomp4"] }
symphonia-adapter-libopus = "0.2.9"

# Metadata extraction
log = "0.4"
lofty = "0.21"

# File system
walkdir = "2"

# Parallel processing
rayon = "1.10"

# Base64 encoding for cover art
base64 = "0.22"

# Thread-safe state
parking_lot = "0.12"

# SQLite database
rusqlite = { version = "0.31", features = ["bundled"] }

# Image processing for thumbnails
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Hashing for cache keys
sha2 = "0.10"
hex = "0.4"

# Directory paths
dirs = "5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-positioner = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.1"
blurhash = "0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.8"


[patch.crates-io]
tauri-plugin-media = { path = "vendor/tauri-plugin-media" }

[profile.release]
# Unwind so a parser panic on one malformed media file can be caught (see parse_guard.rs).
panic = "unwind"
codegen-units = 1
lto = true
opt-level = 3
strip = true
